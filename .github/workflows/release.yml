name: Release

# Publishes @genocode/cli to npm when a version tag (such as v0.2.0) is pushed, unless that version
# is already on npm. Releases are staged: each one waits for approval on npmjs.com (or
# `npm stage approve`) before it goes live. Uses npm trusted publishing, so no npm token is stored
# in the repository: the package lists this workflow as a trusted publisher in its settings on
# npmjs.com.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      # `npm stage` needs npm 12; Node's own npm is older.
      - run: npm install -g npm@12.1.0
      - run: npm ci
      - run: npm run check
      - run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@genocode/cli@$version" version > /dev/null 2>&1; then
            echo "@genocode/cli@$version is already on npm"
          else
            npm stage publish -w @genocode/cli
          fi
